# Maria's Glad — Decap CMS
#
# IMPORTANT:
# This project intentionally uses Decap's GitHub backend instead of Netlify Git Gateway.
# Netlify's current documentation marks Git Gateway as deprecated.
#
# Replace YOUR_GITHUB_USERNAME/marias-glad with the exact owner/repository path.
# The admin must have write access to that GitHub repository.

backend:
  name: github
  repo: ihsakib02/marias-glad
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "products"
    label: "Products"
    description: "Manage the cake catalogue and all order-builder options."
    files:
      - label: "Cake Products"
        name: "products"
        file: "content/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.nameEn}} — {{fields.basePrice}}"
            fields:
              - { label: "Product ID", name: "id", widget: "string", hint: "Use a stable lowercase ID such as chocolate-dream. Avoid changing it after launch." }
              - { label: "Bangla Name", name: "nameBn", widget: "string" }
              - { label: "English Name", name: "nameEn", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Birthday", value: "birthday" }
                  - { label: "Custom", value: "custom" }
              - { label: "Bangla Description", name: "descriptionBn", widget: "text" }
              - { label: "English Description", name: "descriptionEn", widget: "text" }
              - { label: "Product Image", name: "image", widget: "image" }
              - { label: "Base Price", name: "basePrice", widget: "number", value_type: "int", min: 0 }
              - { label: "Available", name: "available", widget: "boolean", default: true }
              - label: "Badges"
                name: "badges"
                widget: "list"
                required: false
                field:
                  label: "Badge"
                  name: "badge"
                  widget: "string"
              - label: "Flavors"
                name: "flavors"
                widget: "list"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Bangla Name", name: "nameBn", widget: "string" }
                  - { label: "English Name", name: "nameEn", widget: "string" }
                  - { label: "Extra Price", name: "extra", widget: "number", value_type: "int", min: 0, default: 0 }
              - label: "Sizes"
                name: "sizes"
                widget: "list"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Bangla Name", name: "nameBn", widget: "string" }
                  - { label: "English Name", name: "nameEn", widget: "string" }
                  - { label: "Size Price", name: "price", widget: "number", value_type: "int", min: 0 }
              - label: "Fillings"
                name: "fillings"
                widget: "list"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Bangla Name", name: "nameBn", widget: "string" }
                  - { label: "English Name", name: "nameEn", widget: "string" }
                  - { label: "Extra Price", name: "extra", widget: "number", value_type: "int", min: 0, default: 0 }
              - label: "Decorations"
                name: "decorations"
                widget: "list"
                fields:
                  - { label: "ID", name: "id", widget: "string" }
                  - { label: "Bangla Name", name: "nameBn", widget: "string" }
                  - { label: "English Name", name: "nameEn", widget: "string" }
                  - { label: "Extra Price", name: "extra", widget: "number", value_type: "int", min: 0, default: 0 }
  - name: "gallery"
    label: "Cake Gallery"
    description: "Upload and manage cake gallery images."
    files:
      - label: "Gallery Images"
        name: "gallery"
        file: "content/gallery.json"
        format: "json"
        fields:
          - label: "Gallery"
            name: "gallery"
            widget: "list"
            summary: "{{fields.titleEn}}"
            fields:
              - { label: "Gallery ID", name: "id", widget: "string", hint: "Use a stable ID such as gallery-01." }
              - { label: "Bangla Title", name: "titleBn", widget: "string", required: false }
              - { label: "English Title", name: "titleEn", widget: "string", required: false }
              - { label: "Cake Image", name: "image", widget: "image" }
              - { label: "Bangla Alt Text", name: "altBn", widget: "string", required: false }
              - { label: "English Alt Text", name: "altEn", widget: "string", required: false }

